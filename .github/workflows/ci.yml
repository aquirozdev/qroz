name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm install
      - name: Pin verified TypeScript toolchain
        run: npm install --no-save typescript@5.8.3
      - run: npm run verify


  node-lts-compat:
    name: Node ${{ matrix.node }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - name: Pin verified TypeScript toolchain
        run: npm install --no-save typescript@5.8.3
      - run: npm run typecheck
      - run: npm test


  packed-consumer:
    name: Packed package consumer
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: npm install
      - name: Pin verified TypeScript toolchain
        run: npm install --no-save typescript@5.8.3
      - name: Build and verify packed packages
        run: npm run pack:check
      - name: Upload packed-consumer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packed-consumer-evidence
          path: .release-evidence
          if-no-files-found: warn
          retention-days: 14

  workerd-smoke:
    name: Cloudflare workerd smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm install
      - name: Install integration toolchain
        run: npm install --no-save typescript@5.8.3 wrangler@4.135.0
      - run: npm run build
      - name: Execute portable app in workerd
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler dev --config examples/hello-world/wrangler.jsonc --local --port 8787 > /tmp/arc-wrangler.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if response=$(curl --fail --silent http://127.0.0.1:8787/users/123); then
              echo "$response" | grep -q '"name":"Angel"'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/arc-wrangler.log
          exit 1

      - name: Execute SQLite Durable Object idempotency in workerd
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler dev --config examples/hello-world/wrangler.idempotency.jsonc --local --port 8788 > /tmp/arc-do.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          key="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in $(seq 1 30); do
            if response=$(curl --fail --silent "http://127.0.0.1:8788/idempotency?key=${key}"); then
              echo "$response" | grep -q '"completed":true'
              echo "$response" | grep -q '"state":"completed"'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/arc-do.log
          exit 1

  cloudflare-workflows:
    name: Cloudflare Workflows local execution
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm install
      - name: Install pinned workflow integration toolchain
        run: npm install --no-save typescript@5.8.3 wrangler@4.135.0
      - run: npm run build
      - name: Execute Arc workflow in Cloudflare Workflows local runtime
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler dev --config integration/cloudflare-workflows/wrangler.jsonc --local --port 8790 > /tmp/arc-workflows.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 40); do
            if curl --silent http://127.0.0.1:8790/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          id="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --fail --silent \
            -X POST \
            -H 'content-type: application/json' \
            --data '{"id":"123","name":"Angel"}' \
            "http://127.0.0.1:8790/workflows/welcome?id=${id}" \
            | grep -q "\"id\":\"${id}\""

          for attempt in $(seq 1 45); do
            response=$(curl --fail --silent "http://127.0.0.1:8790/workflows/welcome?id=${id}")
            if echo "$response" | grep -q '"status":"complete"'; then
              echo "$response" | grep -q '"message":"welcome:Angel"'
              exit 0
            fi
            if echo "$response" | grep -q '"status":"errored"'; then
              echo "$response"
              cat /tmp/arc-workflows.log
              exit 1
            fi
            sleep 1
          done

          cat /tmp/arc-workflows.log
          exit 1

  postgres-drizzle:
    name: PostgreSQL 18 + Drizzle + pg
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/arc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save typescript@5.8.3
      - run: npm run build
      - name: Install pinned database integration dependencies
        working-directory: integration/postgres
        run: npm install
      - name: Execute Arc through real PostgreSQL and Drizzle
        working-directory: integration/postgres
        run: node test.mjs

  mcp-v2:
    name: MCP v2 read-only integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save typescript@5.8.3
      - run: npm run build
      - name: Install official MCP v2 integration dependencies
        working-directory: integration/mcp
        run: npm install
      - name: Execute Arc MCP server/client integration
        working-directory: integration/mcp
        run: node test.mjs


  visual-evidence:
    name: Arc Studio visual evidence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm install
      - name: Pin verified TypeScript toolchain
        run: npm install --no-save typescript@5.8.3
      - run: npm run build
      - name: Install pinned visual evidence dependencies
        working-directory: integration/visual-evidence
        run: npm install
      - name: Install Chromium
        working-directory: integration/visual-evidence
        run: npx playwright install --with-deps chromium
      - name: Execute Arc Studio browser journey
        working-directory: integration/visual-evidence
        run: npm test
      - name: Upload visual product evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arc-studio-visual-evidence
          path: |
            integration/visual-evidence/evidence
            integration/visual-evidence/test-results
            integration/visual-evidence/playwright-report
          if-no-files-found: error
          retention-days: 14

  aws-sdk-floci:
    name: AWS SDK v3 + Floci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_ENDPOINT: http://127.0.0.1:4566
      FLOCI_LAMBDA_ENDPOINT: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Start Floci with Docker-backed Lambda support
        shell: bash
        run: |
          set -euo pipefail
          docker network create arc-floci
          docker run -d \
            --name floci \
            --network arc-floci \
            --network-alias floci \
            -p 4566:4566 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e FLOCI_DEFAULT_REGION=us-east-1 \
            -e FLOCI_STORAGE_MODE=memory \
            -e FLOCI_HOSTNAME=floci \
            -e FLOCI_BASE_URL=http://floci:4566 \
            -e FLOCI_SERVICES_LAMBDA_DOCKER_NETWORK=arc-floci \
            -e FLOCI_SERVICES_LAMBDA_EPHEMERAL=true \
            floci/floci:2.1.0

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4566/_localstack/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs floci
          exit 1

      - run: npm install
      - run: npm install --no-save typescript@5.8.3
      - run: npm run build

      - name: Install pinned AWS SDK v3 integration dependencies
        working-directory: integration/aws
        run: npm install

      - name: Execute S3, SQS and DynamoDB adapters through AWS SDK v3
        working-directory: integration/aws
        run: node test.mjs

      - name: Execute API Gateway v2, Lambda and SQS event source end-to-end
        working-directory: integration/aws
        run: node e2e-floci.mjs

      - name: Print Floci logs on failure
        if: failure()
        run: docker logs floci || true

      - name: Stop Floci
        if: always()
        shell: bash
        run: |
          docker rm -f floci 2>/dev/null || true
          docker network rm arc-floci 2>/dev/null || true
