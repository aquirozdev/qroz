name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm install
      - name: Pin verified TypeScript toolchain
        run: npm install --no-save typescript@5.8.3
      - run: npm run verify

  workerd-smoke:
    name: Cloudflare workerd smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm install
      - name: Install integration toolchain
        run: npm install --no-save typescript@5.8.3 wrangler@4.135.0
      - run: npm run build
      - name: Execute portable app in workerd
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler dev --config examples/hello-world/wrangler.jsonc --local --port 8787 > /tmp/arc-wrangler.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if response=$(curl --fail --silent http://127.0.0.1:8787/users/123); then
              echo "$response" | grep -q '"name":"Angel"'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/arc-wrangler.log
          exit 1

      - name: Execute SQLite Durable Object idempotency in workerd
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler dev --config examples/hello-world/wrangler.idempotency.jsonc --local --port 8788 > /tmp/arc-do.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          key="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in $(seq 1 30); do
            if response=$(curl --fail --silent "http://127.0.0.1:8788/idempotency?key=${key}"); then
              echo "$response" | grep -q '"completed":true'
              echo "$response" | grep -q '"state":"completed"'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/arc-do.log
          exit 1

  postgres-drizzle:
    name: PostgreSQL 18 + Drizzle + pg
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/arc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save typescript@5.8.3
      - run: npm run build
      - name: Install pinned database integration dependencies
        working-directory: integration/postgres
        run: npm install
      - name: Execute Arc through real PostgreSQL and Drizzle
        working-directory: integration/postgres
        run: node test.mjs

  mcp-v2:
    name: MCP v2 read-only integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save typescript@5.8.3
      - run: npm run build
      - name: Install official MCP v2 integration dependencies
        working-directory: integration/mcp
        run: npm install
      - name: Execute Arc MCP server/client integration
        working-directory: integration/mcp
        run: node test.mjs

  aws-sdk-localstack:
    name: AWS SDK v3 + LocalStack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      localstack:
        image: localstack/localstack:2026.08
        ports:
          - 4566:4566
        env:
          SERVICES: s3,sqs,dynamodb
          DEBUG: 0
    env:
      AWS_ENDPOINT: http://127.0.0.1:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save typescript@5.8.3
      - run: npm run build
      - name: Wait for LocalStack
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4566/_localstack/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Install pinned AWS SDK v3 integration dependencies
        working-directory: integration/aws
        run: npm install
      - name: Execute S3, SQS and DynamoDB adapters through AWS SDK v3
        working-directory: integration/aws
        run: node test.mjs
