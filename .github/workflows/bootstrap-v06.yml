name: Bootstrap v0.6 source

on:
  push:
    branches:
      - feat/v0.6-runtime-integrations

permissions:
  contents: write

jobs:
  sync-verify-publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Reconstruct source manifest
        shell: bash
        run: |
          set -euo pipefail
          cat .arc-sync/v06.* | base64 --decode | gzip --decompress > /tmp/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          for item in json.loads(Path('/tmp/manifest.json').read_text()):
              path = Path(item['path'])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(item['content'])
          PY
          rm -rf .arc-sync
          # Workflows are managed separately by the authenticated connector.
          git checkout HEAD -- .github/workflows/ci.yml

      - name: Verify portable suite
        run: |
          npm install
          npm install --no-save typescript@5.8.3 wrangler@4.135.0
          npm run verify

      - name: Verify real SQLite Durable Object in workerd
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          ./node_modules/.bin/wrangler dev \
            --config examples/hello-world/wrangler.idempotency.jsonc \
            --local \
            --port 8788 > /tmp/arc-do.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          key="bootstrap-${GITHUB_RUN_ID}"
          for attempt in $(seq 1 30); do
            if response=$(curl --fail --silent "http://127.0.0.1:8788/idempotency?key=${key}"); then
              echo "$response" | grep -q '"completed":true'
              echo "$response" | grep -q '"state":"completed"'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/arc-do.log
          exit 1

      - name: Publish verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/bootstrap-v06.yml .github/workflows/ci.yml
          git commit -m "feat: add provider lifecycle and runtime integrations"
          git fetch origin feat/v0.6-runtime-integrations
          git rebase origin/feat/v0.6-runtime-integrations
          git push origin HEAD:feat/v0.6-runtime-integrations
