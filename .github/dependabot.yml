version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Guayaquil"
    open-pull-requests-limit: 5
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/integration/mcp"
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: "America/Guayaquil"
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/integration/postgres"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: "America/Guayaquil"
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: "America/Guayaquil"
    open-pull-requests-limit: 3
